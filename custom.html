<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Carousel</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
      }

      .carousel-wrapper {
        width: 90%;
        max-width: 1000px;
        overflow: hidden;
        position: relative;
      }

      .carousel {
        display: flex;
        gap: 20px;
        height: 400px;
        transition: transform 0.5s ease;
        user-select: none;
      }

      .carousel img {
        height: 100%;
        object-fit: cover;
        flex-shrink: 0;
        transition: width 0.5s ease;
        cursor: grab;
      }

      .carousel img.active {
        width: 60%;
      }

      .carousel img.small {
        width: 20%;
      }

      /* Optional arrows */
      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        padding: 0.3rem 0.5rem;
        cursor: pointer;
        user-select: none;
      }

      .arrow.left {
        left: 10px;
      }
      .arrow.right {
        right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="carousel-wrapper">
      <div class="carousel" id="carousel">
        <img src="https://picsum.photos/id/1015/800/600" class="active" />
        <img src="https://picsum.photos/id/1016/800/600" class="small" />
        <img src="https://picsum.photos/id/1018/800/600" class="small" />
        <img src="https://picsum.photos/id/1019/800/600" class="small" />
        <img src="https://picsum.photos/id/1020/800/600" class="small" />
      </div>

      <div class="arrow left" id="prev">&#10094;</div>
      <div class="arrow right" id="next">&#10095;</div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      const images = carousel.querySelectorAll("img");
      let currentIndex = 0;

      function updateCarousel() {
        images.forEach((img, index) => {
          img.classList.remove("active");
          img.classList.add("small");
        });
        images[currentIndex].classList.add("active");
        images[currentIndex].classList.remove("small");

        // calculate translateX
        let offset = 0;
        for (let i = 0; i < currentIndex; i++) {
          offset += images[i].classList.contains("active")
            ? carousel.offsetWidth * 0.6
            : carousel.offsetWidth * 0.2;
        }

        carousel.style.transform = `translateX(${-offset}px)`;
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % images.length;
        updateCarousel();
      }

      function prevSlide() {
        currentIndex = (currentIndex - 1 + images.length) % images.length;
        updateCarousel();
      }

      // Arrow click
      document.getElementById("next").addEventListener("click", nextSlide);
      document.getElementById("prev").addEventListener("click", prevSlide);

      // Drag / swipe
      let startX = 0;
      let isDragging = false;

      carousel.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.pageX;
        carousel.style.cursor = "grabbing";
      });

      carousel.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        carousel.style.cursor = "grab";
        const diff = e.pageX - startX;
        if (diff < -50) nextSlide();
        if (diff > 50) prevSlide();
      });

      carousel.addEventListener("mouseleave", () => {
        isDragging = false;
        carousel.style.cursor = "grab";
      });

      // touch support
      carousel.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
      });
      carousel.addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].clientX - startX;
        if (diff < -50) nextSlide();
        if (diff > 50) prevSlide();
      });

      updateCarousel();
    </script>
  </body>
</html>
