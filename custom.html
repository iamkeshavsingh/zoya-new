<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Looped Custom Carousel</title>
    <style>
      body {
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
      }

      .carousel-wrapper {
        width: 90%;
        max-width: 1000px;
        overflow: hidden;
        position: relative;
      }

      .carousel {
        display: flex;
        gap: 20px;
        height: 400px;
        transition: transform 0.5s ease;
        user-select: none;
      }

      .carousel img {
        height: 100%;
        object-fit: cover;
        flex-shrink: 0;
        transition: width 0.5s ease;
        cursor: grab;
      }

      .carousel img.active {
        width: 60%;
      }

      .carousel img.small {
        width: 20%;
      }

      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 2rem;
        color: white;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 50%;
        padding: 0.3rem 0.5rem;
        cursor: pointer;
        user-select: none;
        z-index: 10;
      }

      .arrow.left {
        left: 10px;
      }
      .arrow.right {
        right: 10px;
      }
    </style>
  </head>
  <body>
    <div class="carousel-wrapper">
      <div class="carousel" id="carousel">
        <img src="https://picsum.photos/id/1015/800/600" />
        <img src="https://picsum.photos/id/1016/800/600" />
        <img src="https://picsum.photos/id/1018/800/600" />
        <img src="https://picsum.photos/id/1019/800/600" />
        <img src="https://picsum.photos/id/1020/800/600" />
      </div>

      <div class="arrow left" id="prev">&#10094;</div>
      <div class="arrow right" id="next">&#10095;</div>
    </div>

    <script>
      const carousel = document.getElementById("carousel");
      let images = Array.from(carousel.querySelectorAll("img"));

      // Clone first and last for loop effect
      const firstClone = images[0].cloneNode(true);
      const lastClone = images[images.length - 1].cloneNode(true);
      carousel.insertBefore(lastClone, images[0]);
      carousel.appendChild(firstClone);

      images = Array.from(carousel.querySelectorAll("img"));

      let currentIndex = 1; // because of clone
      let isTransitioning = false;

      function updateCarousel(animate = true) {
        images.forEach((img, index) => {
          img.classList.remove("active", "small");
          img.classList.add("small");
        });

        images[currentIndex].classList.add("active");
        images[currentIndex].classList.remove("small");

        const slideWidth = carousel.offsetWidth * 0.2; // small width
        const bigWidth = carousel.offsetWidth * 0.6; // active width

        let offset = 0;
        for (let i = 0; i < currentIndex; i++) {
          offset += images[i].classList.contains("active")
            ? bigWidth
            : slideWidth;
        }

        if (!animate) {
          carousel.style.transition = "none";
        } else {
          carousel.style.transition = "transform 0.5s ease";
        }

        carousel.style.transform = `translateX(${-offset}px)`;
      }

      function nextSlide() {
        if (isTransitioning) return;
        isTransitioning = true;
        currentIndex++;
        updateCarousel();
      }

      function prevSlide() {
        if (isTransitioning) return;
        isTransitioning = true;
        currentIndex--;
        updateCarousel();
      }

      carousel.addEventListener("transitionend", () => {
        if (images[currentIndex] === images[0]) {
          currentIndex = images.length - 2; // jump to last real
          updateCarousel(false);
        }
        if (images[currentIndex] === images[images.length - 1]) {
          currentIndex = 1; // jump to first real
          updateCarousel(false);
        }
        isTransitioning = false;
      });

      // Arrows
      document.getElementById("next").addEventListener("click", nextSlide);
      document.getElementById("prev").addEventListener("click", prevSlide);

      // Drag/swipe
      let startX = 0;
      let isDragging = false;

      carousel.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.pageX;
        carousel.style.cursor = "grabbing";
      });

      carousel.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        carousel.style.cursor = "grab";
        const diff = e.pageX - startX;
        if (diff < -50) nextSlide();
        if (diff > 50) prevSlide();
      });

      carousel.addEventListener("mouseleave", () => {
        isDragging = false;
        carousel.style.cursor = "grab";
      });

      carousel.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
      });

      carousel.addEventListener("touchend", (e) => {
        const diff = e.changedTouches[0].clientX - startX;
        if (diff < -50) nextSlide();
        if (diff > 50) prevSlide();
      });

      updateCarousel(false);
    </script>
  </body>
</html>
