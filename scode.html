<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Left-Active Swiper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #000;
      }
      .swiper {
        width: 100%;
        height: 100%;
      }

      /* all slides default 20% */
      .swiper-slide {
        background: #444;
        color: #fff;
        font-size: 18px;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 20% !important;
        transition: width 0.3s ease;
      }

      /* active = leftmost */
      .swiper-slide.swiper-slide-active {
        width: 60% !important;
        background: #666;
      }
    </style>
  </head>
  <body>
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">Slide 1</div>
        <div class="swiper-slide">Slide 2</div>
        <div class="swiper-slide">Slide 3</div>
        <div class="swiper-slide">Slide 4</div>
        <div class="swiper-slide">Slide 5</div>
        <div class="swiper-slide">Slide 6</div>
      </div>

      <div class="swiper-button-next"></div>
      <div class="swiper-button-prev"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const totalSlides = document.querySelectorAll(
        ".mySwiper .swiper-slide"
      ).length;

      const swiper = new Swiper(".mySwiper", {
        slidesPerView: "auto", // we control widths manually
        spaceBetween: 30,
        loop: totalSlides > 3,
        // key part ↓ : DO NOT center
        centeredSlides: false,
        initialSlide: 0,
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        // Important: keep leftmost as active
        watchSlidesProgress: true,
        on: {
          slideChange() {
            // force swiper to keep active slide at index swiper.realIndex
            // nothing special needed; with centeredSlides:false, active is leftmost
          },
        },
      });
    </script>
  </body>
</html>
