<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Image Slider</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: #1a1a1a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        overflow: hidden;
      }

      .slider-container {
        width: 100%;
        max-width: 1200px;
        position: relative;
        overflow: hidden;
      }

      .slider-wrapper {
        display: flex;
        gap: 20px;
        overflow: visible;
        padding: 20px 0;
        position: relative;
        min-height: 600px; /* accommodates tallest card */
      }

      .slide {
        flex-shrink: 0;
        border-radius: 12px;
        overflow: hidden;
        transition: none;
        position: relative;
        height: 508px; /* default small height */
      }

      .slide img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .slide-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 20px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        color: white;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      .arrow-btn {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 2px solid #fff;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .arrow-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
      }

      .arrow-btn:active {
        transform: scale(0.95);
      }

      .arrow-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderWrapper">
        <div class="slide" data-index="0">
          <img
            src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&h=600&fit=crop"
            alt="Mountain"
          />
          <div class="slide-overlay">
            <h3>Mountain Vista</h3>
          </div>
        </div>
        <div class="slide" data-index="1">
          <img
            src="https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=800&h=600&fit=crop"
            alt="Ocean"
          />
          <div class="slide-overlay">
            <h3>Ocean Waves</h3>
          </div>
        </div>
        <div class="slide" data-index="2">
          <img
            src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&h=600&fit=crop"
            alt="Forest"
          />
          <div class="slide-overlay">
            <h3>Forest Path</h3>
          </div>
        </div>
        <div class="slide" data-index="3">
          <img
            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&h=600&fit=crop"
            alt="Desert"
          />
          <div class="slide-overlay">
            <h3>Desert Dunes</h3>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="arrow-btn" id="prevBtn">←</button>
        <button class="arrow-btn" id="nextBtn">→</button>
      </div>
    </div>

    <script>
      const wrapper = document.getElementById("sliderWrapper");
      const slides = Array.from(document.querySelectorAll(".slide"));
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      let isAnimating = false;
      let currentIndex = 0;
      let autoSlideInterval;

      function getWidths() {
        const containerWidth = wrapper.offsetWidth;
        const gap = 20;
        const totalGaps = 2 * gap;
        const availableWidth = containerWidth - totalGaps;

        return {
          large: availableWidth * 0.6,
          small: availableWidth * 0.2,
          largeHeight: 588,
          smallHeight: 508,
        };
      }

      function setWidths() {
        const widths = getWidths();
        slides.forEach((slide, index) => {
          if (index === currentIndex) {
            gsap.set(slide, {
              width: widths.large,
              height: widths.largeHeight,
            });
          } else {
            gsap.set(slide, {
              width: widths.small,
              height: widths.smallHeight,
            });
          }
        });
      }

      setWidths();
      window.addEventListener("resize", () => {
        if (!isAnimating) {
          setWidths();
        }
      });

      function slideRight() {
        if (isAnimating) return;
        isAnimating = true;

        const widths = getWidths();
        const pos1 = 0;
        const pos2 = widths.large + 20;
        const pos3 = widths.large + widths.small + 40;
        const posOffScreenLeft = -(widths.large + 20);
        const posOffScreenRight = pos3 + widths.small + 20;

        slides.forEach((slide, index) => {
          let currentLeft;
          if (index === 0) currentLeft = pos1;
          else if (index === 1) currentLeft = pos2;
          else if (index === 2) currentLeft = pos3;

          if (index < 3) {
            gsap.set(slide, {
              position: "absolute",
              left: currentLeft,
              top: 20,
              width: index === 0 ? widths.large : widths.small,
              height: index === 0 ? widths.largeHeight : widths.smallHeight,
            });
          }
        });

        const incoming = slides[3];
        gsap.set(incoming, {
          position: "absolute",
          left: posOffScreenRight,
          top: 20,
          width: widths.small,
          height: widths.smallHeight,
        });

        const tl = gsap.timeline({
          onComplete: () => {
            const firstSlide = slides.shift();
            slides.push(firstSlide);
            wrapper.appendChild(firstSlide);

            slides.forEach((slide) => {
              gsap.set(slide, { clearProps: "position,left,top" });
            });
            gsap.set(slides[0], {
              width: widths.large,
              height: widths.largeHeight,
            });
            gsap.set([slides[1], slides[2]], {
              width: widths.small,
              height: widths.smallHeight,
            });
            currentIndex = 0;
            isAnimating = false;
          },
        });

        tl.to(
          slides[0],
          { left: posOffScreenLeft, duration: 0.6, ease: "power2.inOut" },
          0
        );
        tl.to(
          slides[1],
          {
            left: pos1,
            width: widths.large,
            height: widths.largeHeight,
            duration: 0.6,
            ease: "power2.inOut",
          },
          0
        );
        tl.to(
          slides[2],
          { left: pos2, duration: 0.6, ease: "power2.inOut" },
          0
        );
        tl.to(incoming, { left: pos3, duration: 0.6, ease: "power2.inOut" }, 0);
      }

      function slideLeft() {
        if (isAnimating) return;
        isAnimating = true;

        const widths = getWidths();
        const pos1 = 0;
        const pos2 = widths.large + 20;
        const pos3 = widths.large + widths.small + 40;
        const posOffScreenLeft = -(widths.small + 20);

        const lastSlide = slides.pop();
        slides.unshift(lastSlide);
        wrapper.insertBefore(lastSlide, wrapper.firstChild);

        gsap.set(slides[0], {
          position: "absolute",
          left: posOffScreenLeft,
          top: 20,
          width: widths.small,
          height: widths.smallHeight,
        });
        gsap.set(slides[1], {
          position: "absolute",
          left: pos1,
          top: 20,
          width: widths.large,
          height: widths.largeHeight,
        });
        gsap.set(slides[2], {
          position: "absolute",
          left: pos2,
          top: 20,
          width: widths.small,
          height: widths.smallHeight,
        });

        const outgoing = slides[3];
        gsap.set(outgoing, {
          position: "absolute",
          left: pos3,
          top: 20,
          width: widths.small,
          height: widths.smallHeight,
        });

        const tl = gsap.timeline({
          onComplete: () => {
            slides.forEach((slide) => {
              gsap.set(slide, { clearProps: "position,left,top" });
            });
            gsap.set(slides[0], {
              width: widths.large,
              height: widths.largeHeight,
            });
            gsap.set([slides[1], slides[2]], {
              width: widths.small,
              height: widths.smallHeight,
            });
            currentIndex = 0;
            isAnimating = false;
          },
        });

        tl.to(
          slides[0],
          {
            left: pos1,
            width: widths.large,
            height: widths.largeHeight,
            duration: 0.6,
            ease: "power2.inOut",
          },
          0
        );
        tl.to(
          slides[1],
          {
            left: pos2,
            width: widths.small,
            height: widths.smallHeight,
            duration: 0.6,
            ease: "power2.inOut",
          },
          0
        );
        tl.to(
          slides[2],
          { left: pos3, duration: 0.6, ease: "power2.inOut" },
          0
        );
        tl.to(
          outgoing,
          {
            left: pos3 + widths.small + 20,
            duration: 0.6,
            ease: "power2.inOut",
          },
          0
        );
      }

      nextBtn.addEventListener("click", () => {
        slideRight();
        resetAutoSlide();
      });
      prevBtn.addEventListener("click", () => {
        slideLeft();
        resetAutoSlide();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") {
          slideRight();
          resetAutoSlide();
        }
        if (e.key === "ArrowLeft") {
          slideLeft();
          resetAutoSlide();
        }
      });

      // Auto-slide every 6 seconds
      function startAutoSlide() {
        autoSlideInterval = setInterval(() => {
          slideRight();
        }, 6000);
      }

      function resetAutoSlide() {
        clearInterval(autoSlideInterval);
        startAutoSlide();
      }

      startAutoSlide();
    </script>
  </body>
</html>
